name: Feature request
description: Ask for something the TikTok Ads MCP server cannot do yet.
labels: [enhancement]
body:
  - type: textarea
    id: job
    attributes:
      label: What job do you want done?
      description: Describe the task in your own words, e.g. "pause every ad set whose frequency is over 5".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today?
  - type: dropdown
    id: client
    attributes:
      label: MCP client you use
      options:
        - Claude (claude.ai or Desktop)
        - Claude Code
        - ChatGPT
        - Codex
        - Cursor
        - Gemini CLI
        - GitHub Copilot (VS Code)
        - Google Antigravity
        - Windsurf
        - Lovable
        - Grok
        - Cline
        - Devin
        - Replit Agent
        - Other
